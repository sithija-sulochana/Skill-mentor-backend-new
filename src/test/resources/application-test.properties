# Test profile configuration
spring.application.name=springpractice

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test JWT secret
jwt.secret=test-secret-key-must-be-at-least-32-characters-long-for-HS256

# Use JWT validator for tests (instead of Clerk)
auth.validator.type=skill-mentor

